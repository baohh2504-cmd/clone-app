name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # cần để tạo Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # cần để generate release notes

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./Clone App/source/ui/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Clone App/source/ui/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install pyinstaller
        run: pip install pyinstaller

      - name: Install npm deps
        working-directory: 'Clone App/source/ui'
        run: npm ci

      - name: Build distributable
        working-directory: 'Clone App/source/ui'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # electron-builder needs this even when not auto-publishing

      - name: List release artifacts
        shell: bash
        run: ls -la "Clone App/source/ui/release/"

      - name: Generate SHA256
        shell: bash
        working-directory: 'Clone App/source/ui/release'
        run: |
          sha256sum CloneApp-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Clone App/source/ui/release/CloneApp-Setup-*.exe
            Clone App/source/ui/release/SHA256SUMS.txt
          body: |
            ## Clone App Release

            **⚠️ Disclaimer:** This is an unsigned executable. Windows Defender SmartScreen may show a warning on first launch. Click "More info" → "Run anyway" to proceed.

            ### Verify download integrity

            After downloading, verify the SHA256 checksum matches:
            ```
            certutil -hashfile CloneApp-Setup-${{ github.ref_name }}.exe SHA256
            ```

            Compare with the value in `SHA256SUMS.txt`.

            ### Build provenance

            Built from commit `${{ github.sha }}` via [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
