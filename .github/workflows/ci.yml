name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Clone App/source/ui/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install npm deps
        working-directory: 'Clone App/source/ui'
        run: npm ci

      - name: Validate package.json
        working-directory: 'Clone App/source/ui'
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Syntax check JS files
        working-directory: 'Clone App/source/ui'
        shell: bash
        run: |
          set -e
          for f in main.js preload.js renderer.js configCrypto.js updateService.js unhandled-error-logger.js; do
            echo "Checking $f"
            node -c "$f"
          done

      - name: Python syntax check
        shell: bash
        run: python -m py_compile "Clone App/source/launcher/runas_launcher.py"
